[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gtvh-multimodal-analyzer"
dynamic = ["version"]
description = "Multimodal GTVH annotation of humorous cartoons with Anthropic, OpenAI or Gemini models"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Ahmad Yasin", email = "iamahmadyasinedu@gmail.com"}]
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.0",
    "openai>=2.0",
    "google-genai>=1.30",
    "jsonschema>=4.18",
    "PyYAML>=6.0",
    "Jinja2>=3.1",
    "openpyxl>=3.1",
    "Pillow>=10",
    "keyring>=25",
    "PySide6>=6.6",
]

[project.optional-dependencies]
build = ["pyinstaller>=6"]

[project.scripts]
gtvh = "gtvh.cli:main"

[tool.setuptools.dynamic]
version = {attr = "gtvh.__version__"}

[tool.setuptools.packages.find]
include = ["gtvh*"]

[tool.setuptools.package-data]
gtvh = ["resources/*.yaml", "resources/prompts/*.md", "gui/*.png", "gui/*.ico"]
